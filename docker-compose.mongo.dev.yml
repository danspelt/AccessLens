version: '3.8'
services:
  mongodb:
    image: mongo:7
    container_name: accesslens-mongo-dev
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: devpassword
      MONGO_INITDB_DATABASE: accesslens
    volumes:
      - accesslens_mongo_data:/data/db

volumes:
  accesslens_mongo_data:
